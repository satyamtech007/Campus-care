<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Care - Student Registration</title>
  <meta name="description"
    content="Register a student account on Campus Care to report lost items, log issues, and track resolutions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=darktheme2">
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('campusCare_theme');
        var systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = savedTheme ? savedTheme : (systemPrefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>

<body class="login-page-body">
  <!-- Header / Brand -->
  <header class="site-header">
    <div class="header-container">
      <div class="brand">
        <a href="index.html"
          style="display: flex; align-items: center; gap: 0.85rem; text-decoration: none; color: inherit;">
          <div class="brand-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              <path d="m9 12 2 2 4-4" />
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-title">Campus Care</span>
          </div>
        </a>
      </div>
      <div class="header-actions">
        <button type="button" class="btn-theme-toggle" id="themeToggleBtn" aria-label="Toggle dark mode"
          title="Toggle theme">
          <svg class="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="main-wrapper" style="max-width: 580px; margin: 2rem auto; padding: 0 1rem;">
    <div class="auth-container" style="max-width: 580px; margin: 0 auto;">
      <div class="form-card auth-card">
        <!-- Auth Header -->
        <div class="auth-header">
          <div class="icon-circle bg-primary-soft"
            style="width: 54px; height: 54px; margin: 0 auto 1rem auto; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-md);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
              <path d="M6 12v5c3 3 9 3 12 0v-5" />
            </svg>
          </div>
          <h1 class="page-title" style="font-size: 1.75rem; margin-bottom: 0.35rem;">Student Registration</h1>
          <p class="page-description" style="font-size: 0.92rem;">Create your student account to file reports and track
            live updates</p>
        </div>

        <!-- Inline Error Alert Box -->
        <div id="registerAlert" class="track-error-inline" style="display: none; margin-bottom: 1.25rem;"></div>

        <!-- Inline Success Alert Box -->
        <div id="registerSuccessAlert"
          style="display: none; margin-bottom: 1.25rem; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.35); color: #10B981; padding: 0.85rem 1rem; border-radius: var(--radius-md); font-weight: 600; font-size: 0.92rem; text-align: center;">
        </div>

        <!-- Registration Form -->
        <form id="studentRegisterForm" novalidate>
          <!-- Full Name -->
          <div class="form-group" id="group-regFullName">
            <label for="regFullName">Full Name <span class="req">*</span></label>
            <div class="input-wrapper">
              <input type="text" id="regFullName" name="fullName" placeholder="e.g. Aditya Sharma" autocomplete="name"
                required>
            </div>
            <span class="error-msg" id="err-regFullName"></span>
          </div>

          <!-- Roll Number & Phone Number Row -->
          <div class="form-row">
            <div class="form-group" id="group-regRollNumber">
              <label for="regRollNumber">Roll Number <span class="req">*</span></label>
              <div class="input-wrapper">
                <input type="text" id="regRollNumber" name="rollNumber" placeholder="e.g. 21CS042" autocomplete="off"
                  required>
              </div>
              <span class="error-msg" id="err-regRollNumber"></span>
            </div>

            <div class="form-group" id="group-regPhone">
              <label for="regPhone">Phone Number <span class="req">*</span></label>
              <div class="input-wrapper">
                <input type="tel" id="regPhone" name="phone" inputmode="numeric" pattern="[0-9]{10}" maxlength="10"
                  placeholder="e.g. 9876543210" autocomplete="tel" required>
              </div>
              <span class="error-msg" id="err-regPhone"></span>
            </div>
          </div>

          <!-- Email -->
          <div class="form-group" id="group-regEmail">
            <label for="regEmail">College Email <span class="req">*</span></label>
            <div class="input-wrapper">
              <input type="email" id="regEmail" name="email" placeholder="e.g. student@college.edu"
                autocomplete="email" required>
            </div>
            <span class="error-msg" id="err-regEmail"></span>
          </div>

          <!-- Password & Confirm Password Row -->
          <div class="form-row">
            <div class="form-group" id="group-regPassword">
              <label for="regPassword">Password <span class="req">*</span></label>
              <div class="input-wrapper">
                <input type="password" id="regPassword" name="password" placeholder="At least 6 characters"
                  autocomplete="new-password" minlength="6" required>
                <button type="button" class="password-toggle" data-target="regPassword" aria-label="Show password"
                  title="Show password">
                  <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                    <line x1="1" y1="1" x2="23" y2="23" />
                  </svg>
                </button>
              </div>
              <span class="error-msg" id="err-regPassword"></span>
            </div>

            <div class="form-group" id="group-regConfirmPassword">
              <label for="regConfirmPassword">Confirm Password <span class="req">*</span></label>
              <div class="input-wrapper">
                <input type="password" id="regConfirmPassword" name="confirmPassword" placeholder="Re-enter password"
                  autocomplete="new-password" minlength="6" required>
                <button type="button" class="password-toggle" data-target="regConfirmPassword"
                  aria-label="Show password" title="Show password">
                  <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                    <line x1="1" y1="1" x2="23" y2="23" />
                  </svg>
                </button>
              </div>
              <span class="error-msg" id="err-regConfirmPassword"></span>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="regSubmitBtn" class="btn btn-primary"
            style="width: 100%; height: 48px; font-size: 1rem; margin-top: 0.5rem;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <line x1="20" y1="8" x2="20" y2="14"></line>
              <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
            <span id="regSubmitText">Create Student Account</span>
          </button>
        </form>

        <!-- Already have an account? Login -->
        <div class="auth-footer-links"
          style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color);">
          <p style="font-size: 0.9rem; color: var(--text-muted); margin: 0;">
            Already have an account? <a href="login.html" id="linkToLogin"
              style="color: var(--color-primary); font-weight: 600; text-decoration: underline; margin-left: 0.25rem;">Login</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <footer class="site-footer">
    <p>&copy; Campus Care Portal &bull; Centralized Issue & Lost/Found Management System</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-client.js"></script>
  <script src="register.js"></script>
</body>

</html>
